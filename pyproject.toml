[project]
name = "mdmaker"
version = "0.5.2"
description = "Multi-format e-book to Markdown converter — pandoc for e-books (GUI + CLI)"
readme = "docs/README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Eisenagel-Studio"}]
keywords = ["markdown", "ebook", "converter", "pdf", "epub", "ocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
]

dependencies = [
    "PyMuPDF>=1.24.3",
    "pdfplumber>=0.7",
    "tqdm>=4.60",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3", "Pillow>=9.0"]
docx = ["python-docx>=0.8"]
security = ["defusedxml>=0.7"]
gui = ["PySide6>=6.5"]
all = ["mdmaker[ocr,docx,security,gui]"]

[project.scripts]
mdmaker = "src.cli:main"
mdmaker-gui = "src.gui.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
